{{- $prover := include "privacy-starknet.componentValues" (list . "transactionProver") | fromYaml -}}
{{- if and $prover.backendConfig $prover.backendConfig.enabled }}
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: transaction-prover
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "privacy-starknet.labels" . | nindent 4 }}
    app: transaction-prover
spec:
  # The prover has no GET health route, so GCE checks the sidecar instead.
  # Allow GCE health-check traffic to reach the configured sidecar port.
  healthCheck:
    type: {{ $prover.backendConfig.healthCheck.type | default "HTTP" }}
    {{- with $prover.backendConfig.healthCheck.requestPath }}
    requestPath: {{ . }}
    {{- end }}
    {{- with $prover.backendConfig.healthCheck.port }}
    port: {{ . }}
    {{- end }}
{{- end }}
