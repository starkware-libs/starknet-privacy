{{- $prover := .Values.transactionProver -}}
{{- $sidecar := $prover.proofInterceptor -}}
{{- $component := list . "transaction-prover" -}}
{{- $config := deepCopy $prover.config -}}
{{- if $sidecar.enabled -}}
{{- $_ := set $config "blocking_check_url" (printf "http://localhost:%v" $sidecar.port) -}}
{{- $_ := set $config "blocking_check_timeout_millis" (int $sidecar.blockingCheck.timeoutMillis) -}}
{{- $_ := set $config "blocking_check_fail_open" $sidecar.blockingCheck.failOpen -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "privacy-starknet.componentName" $component }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "privacy-starknet.labels" $component | nindent 4 }}
data:
  config.json: |
    {{- $config | toPrettyJson | nindent 4 }}
