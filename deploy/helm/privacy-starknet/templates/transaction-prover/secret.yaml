{{- $ohttp := .Values.transactionProver.ohttp -}}
{{- if and $ohttp.enabled (not $ohttp.existingSecret) }}
{{- $component := list . "transaction-prover" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "privacy-starknet.ohttpSecretName" (list . "transaction-prover" $ohttp) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "privacy-starknet.labels" $component | nindent 4 }}
type: Opaque
data:
  key: {{ required "transactionProver.ohttp.key or transactionProver.ohttp.existingSecret is required when OHTTP is enabled" $ohttp.key | b64enc | quote }}
{{- end }}
