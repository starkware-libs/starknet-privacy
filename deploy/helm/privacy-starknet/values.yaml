# Override the chart name used in resource names and labels.
nameOverride: ""
# Override the release-scoped prefix of every resource name.
fullnameOverride: ""

# Pull secrets for private registries, shared by all Pods.
imagePullSecrets: []
  # - name: ghcr-credentials

# Transaction prover
transactionProver:
  replicaCount: 1

  image:
    repository: ghcr.io/starkware-libs/starknet-privacy/transaction-prover
    # Defaults to the chart's appVersion, i.e. the release this chart was published with.
    tag: ""
    pullPolicy: IfNotPresent

  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}

  # The prover typically needs around 32 CPUs and 48 GiB of memory.
  resources: {}
    # requests:
    #   cpu: "32"
    #   memory: 48Gi

  nodeSelector: {}
  tolerations: []
  affinity: {}

  # The prover's JSON-RPC server has no GET health route, so its probes check the port.
  livenessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 10
    periodSeconds: 30
  readinessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

  service:
    type: ClusterIP
    annotations: {}
      # cloud.google.com/neg: '{"ingress":true}'

  # GKE BackendConfig. The prover's JSON-RPC backend is POST-only, so the GCE health
  # check targets the proof-interceptor's /health instead. The chart links it to the
  # Service through the cloud.google.com/backend-config annotation. Disable off GKE.
  backendConfig:
    enabled: true
    healthCheck:
      type: HTTP
      requestPath: /health
      # Defaults to proofInterceptor.port.
      port: null

  ingress:
    enabled: false
    # IngressClass to use (e.g. "gce", "nginx"). Leave empty for the cluster default.
    className: ""
    # HTTP-01 certificate issuance requires port 80; use DNS-01 if HTTP must stay off.
    annotations: {}
      # kubernetes.io/ingress.global-static-ip-name: transaction-prover-ip
      # cert-manager.io/cluster-issuer: letsencrypt-prod
    # One rule per host. Omit `host` for a catch-all rule.
    hosts:
      - host: prover.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
      # - secretName: transaction-prover-tls
      #   hosts:
      #     - prover.example.com

  # Rendered as config.json. rpc_node_url must point to Pathfinder.
  config:
    rpc_node_url: ""
    chain_id: ""
    ip: "0.0.0.0"
    port: 3000
    max_concurrent_requests: 2
    max_connections: 10
    validate_zero_fee_fields: true
    strk_fee_token_address: "0x4718f5a0fc34cc1af16a1cdee98ffb20c31f5cd61d6ab07201858f4287c938d"
    prefetch_state: true
    use_latest_versioned_constants: true
    cors_allow_origin:
      - "*"

  ohttp:
    enabled: true
    # Name of an existing Secret holding the OHTTP key under `key`. When empty, the chart
    # creates one from `key` below.
    existingSecret: ""
    # 32-byte hex key. Supply it from a private values file, never from this file.
    key: ""

  # Proof-interceptor screening sidecar.
  proofInterceptor:
    enabled: true
    image:
      repository: ghcr.io/starkware-libs/starknet-privacy/proof-interceptor
      # Defaults to the chart's appVersion.
      tag: ""
      pullPolicy: IfNotPresent
    port: 8080
    securityContext: {}
    resources:
      requests:
        cpu: 500m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi
    livenessProbe:
      httpGet:
        path: /health
        port: interceptor
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 2
    readinessProbe:
      httpGet:
        path: /health
        port: interceptor
      initialDelaySeconds: 3
      periodSeconds: 5
      timeoutSeconds: 2
    screening:
      # Existing Secret with `partner-name` and `partner-secret` keys.
      existingSecret: proof-interceptor-screening
      # URL of the elliptic-proxy Cloud Function. Required.
      url: ""
      # Privacy pool contract address. Required.
      poolAddress: ""
      # Anonymizer contract address. Required.
      anonymizerAddress: ""
      # Sidecar -> elliptic-proxy: fail closed (block on screening errors).
      failOpen: false
      timeoutMs: 10000
      maxRetries: 2
    # Prover -> sidecar: fail closed (block when the sidecar errors or times out).
    blockingCheck:
      timeoutMillis: 2000
      failOpen: false

# Discovery service
discoveryService:
  replicaCount: 1

  image:
    repository: ghcr.io/starkware-libs/starknet-privacy/discovery-service
    # Defaults to the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent

  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # The readiness probe also gives GKE a health-check path to infer.
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 2
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2

  # Port the API listens on, used by the container, Service and Ingress.
  port: 8080

  service:
    type: ClusterIP
    annotations: {}
      # cloud.google.com/neg: '{"ingress":true}'

  # GKE BackendConfig, linked to the Service by the chart. Disable off GKE.
  backendConfig:
    enabled: true
    healthCheck:
      type: HTTP
      requestPath: /health

  ingress:
    enabled: false
    # IngressClass to use (e.g. "gce", "nginx"). Leave empty for the cluster default.
    className: ""
    # HTTP-01 certificate issuance requires port 80; use DNS-01 if HTTP must stay off.
    annotations: {}
      # kubernetes.io/ingress.global-static-ip-name: discovery-service-ip
      # cert-manager.io/cluster-issuer: letsencrypt-prod
    # One rule per host. Omit `host` for a catch-all rule.
    hosts:
      - host: discovery.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
      # - secretName: discovery-service-tls
      #   hosts:
      #     - discovery.example.com

  # HTTP RPC for queries and WebSocket for block and event subscriptions.
  config:
    rpcUrl: ""
    wsUrl: ""
    rustLog: info
    api:
      health_max_lag_secs: 10

  ohttp:
    enabled: true
    # Name of an existing Secret holding the OHTTP key under `key`. When empty, the chart
    # creates one from `key` below.
    existingSecret: ""
    # 32-byte hex key. Supply it from a private values file, never from this file.
    key: ""
