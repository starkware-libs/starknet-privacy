{{- $prover := .Values.transactionProver -}}
{{- $sidecar := $prover.proofInterceptor -}}
{{- $component := list . "transaction-prover" -}}
{{- $_ := required "transactionProver.config.rpc_node_url is required" $prover.config.rpc_node_url -}}
{{- $_ := required "transactionProver.config.chain_id is required" $prover.config.chain_id -}}
{{- if $sidecar.enabled -}}
{{- $_ := required "transactionProver.proofInterceptor.screening.url is required when proofInterceptor is enabled" $sidecar.screening.url -}}
{{- $_ := required "transactionProver.proofInterceptor.screening.poolAddress is required when proofInterceptor is enabled" $sidecar.screening.poolAddress -}}
{{- $_ := required "transactionProver.proofInterceptor.screening.anonymizerAddress is required when proofInterceptor is enabled" $sidecar.screening.anonymizerAddress -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "privacy-starknet.componentName" $component }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "privacy-starknet.labels" $component | nindent 4 }}
spec:
  replicas: {{ $prover.replicaCount }}
  selector:
    matchLabels:
      {{- include "privacy-starknet.selectorLabels" $component | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/transaction-prover/configmap.yaml") . | sha256sum }}
        {{- if $sidecar.enabled }}
        checksum/proof-interceptor-env: {{ include (print $.Template.BasePath "/transaction-prover/proof-interceptor-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if $prover.ohttp.enabled }}
        checksum/ohttp: {{ include (print $.Template.BasePath "/transaction-prover/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with $prover.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "privacy-starknet.labels" $component | nindent 8 }}
        {{- with $prover.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $prover.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: transaction-prover
          image: {{ include "privacy-starknet.image" (list . $prover.image) | quote }}
          imagePullPolicy: {{ $prover.image.pullPolicy }}
          {{- with $prover.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - --config-file=/etc/config/config.json
          {{- if $prover.ohttp.enabled }}
          env:
            - name: OHTTP_ENABLED
              value: "true"
            - name: OHTTP_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "privacy-starknet.ohttpSecretName" (list . "transaction-prover" $prover.ohttp) }}
                  key: key
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $prover.config.port }}
              protocol: TCP
          {{- with $prover.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $prover.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $prover.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/config
              readOnly: true
        {{- if $sidecar.enabled }}
        - name: proof-interceptor
          image: {{ include "privacy-starknet.image" (list . $sidecar.image) | quote }}
          imagePullPolicy: {{ $sidecar.image.pullPolicy }}
          {{- with $sidecar.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "privacy-starknet.componentName" (list . "proof-interceptor") }}
          env:
            - name: SCREENING_PARTNER_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ $sidecar.screening.existingSecret }}
                  key: partner-name
            - name: SCREENING_PARTNER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $sidecar.screening.existingSecret }}
                  key: partner-secret
          ports:
            - name: interceptor
              containerPort: {{ $sidecar.port }}
              protocol: TCP
          {{- with $sidecar.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $sidecar.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $sidecar.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      {{- with $prover.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $prover.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $prover.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "privacy-starknet.componentName" $component }}
