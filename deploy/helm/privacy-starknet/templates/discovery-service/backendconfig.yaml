{{- $discovery := .Values.discoveryService -}}
{{- if $discovery.backendConfig.enabled }}
{{- $component := list . "discovery-service" }}
{{- $healthCheck := $discovery.backendConfig.healthCheck }}
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ include "privacy-starknet.componentName" $component }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "privacy-starknet.labels" $component | nindent 4 }}
spec:
  healthCheck:
    type: {{ $healthCheck.type }}
    requestPath: {{ $healthCheck.requestPath }}
    port: {{ $healthCheck.port | default $discovery.port }}
{{- end }}
