{{- $ohttp := .Values.discoveryService.ohttp -}}
{{- if and $ohttp.enabled (not $ohttp.existingSecret) }}
{{- $component := list . "discovery-service" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "privacy-starknet.ohttpSecretName" (list . "discovery-service" $ohttp) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "privacy-starknet.labels" $component | nindent 4 }}
type: Opaque
data:
  key: {{ required "discoveryService.ohttp.key or discoveryService.ohttp.existingSecret is required when OHTTP is enabled" $ohttp.key | b64enc | quote }}
{{- end }}
