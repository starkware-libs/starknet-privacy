{{- if and .Values.transactionProver.backendConfig .Values.transactionProver.backendConfig.enabled }}
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: transaction-prover
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "privacy-starknet.labels" . | nindent 4 }}
    app: transaction-prover
spec:
  # The prover has no GET health route, so GCE checks the sidecar instead.
  # Allow GCE health-check traffic to reach the configured sidecar port.
  healthCheck:
    type: {{ .Values.transactionProver.backendConfig.healthCheck.type | default "HTTP" }}
    {{- with .Values.transactionProver.backendConfig.healthCheck.requestPath }}
    requestPath: {{ . }}
    {{- end }}
    {{- with .Values.transactionProver.backendConfig.healthCheck.port }}
    port: {{ . }}
    {{- end }}
{{- end }}
