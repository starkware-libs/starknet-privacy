{{- $discovery := include "privacy-starknet.componentValues" (list . "discoveryService") | fromYaml -}}
{{- $_ := required "discoveryService.config.rpcUrl is required" $discovery.config.rpcUrl -}}
{{- $_ := required "discoveryService.config.wsUrl is required" $discovery.config.wsUrl -}}
{{- if $discovery.ohttp.enabled -}}
{{- $_ := required "discoveryService.ohttp.key (or global.ohttp.key) is required when OHTTP is enabled" $discovery.ohttp.key -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "privacy-starknet.labels" . | nindent 4 }}
    app: discovery-service
spec:
  progressDeadlineSeconds: {{ $discovery.progressDeadlineSeconds }}
  replicas: {{ $discovery.replicas }}
  revisionHistoryLimit: {{ $discovery.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: discovery-service
  strategy:
    type: {{ $discovery.strategy.type }}
    {{- if eq $discovery.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ $discovery.strategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ $discovery.strategy.rollingUpdate.maxUnavailable }}
    {{- end }}
  template:
    metadata:
      labels:
        app: discovery-service
      annotations:
        checksum/config: {{ include "privacy-starknet.discoveryService.configToml" . | sha256sum | quote }}
    spec:
      containers:
        - name: discovery-service
          image: "{{ $discovery.image.repository }}:{{ $discovery.image.tag }}"
          imagePullPolicy: {{ $discovery.image.pullPolicy }}
          args:
            - --config
            - /etc/discovery-service/config.toml
          env:
            - name: API_HOST
              value: {{ $discovery.config.apiHost | quote }}
            {{- if $discovery.ohttp.enabled }}
            - name: OHTTP_KEY
              value: {{ $discovery.ohttp.key | quote }}
            {{- end }}
          ports:
            - containerPort: {{ $discovery.containerPort }}
              protocol: TCP
          {{- with $discovery.readinessProbe }}
          readinessProbe:
            httpGet:
              path: {{ .path | default "/health" }}
              port: {{ $discovery.containerPort }}
            initialDelaySeconds: {{ .initialDelaySeconds | default 5 }}
            periodSeconds: {{ .periodSeconds | default 10 }}
            timeoutSeconds: {{ .timeoutSeconds | default 2 }}
            failureThreshold: {{ .failureThreshold | default 3 }}
            successThreshold: {{ .successThreshold | default 1 }}
          {{- end }}
          {{- with $discovery.livenessProbe }}
          livenessProbe:
            httpGet:
              path: {{ .path | default "/health" }}
              port: {{ $discovery.containerPort }}
            initialDelaySeconds: {{ .initialDelaySeconds | default 15 }}
            periodSeconds: {{ .periodSeconds | default 30 }}
            timeoutSeconds: {{ .timeoutSeconds | default 2 }}
            failureThreshold: {{ .failureThreshold | default 3 }}
            successThreshold: {{ .successThreshold | default 1 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/discovery-service/config.toml
              readOnly: true
              subPath: config.toml
          {{- with $discovery.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      dnsPolicy: {{ $discovery.dnsPolicy }}
      {{- with $discovery.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $discovery.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: {{ $discovery.restartPolicy }}
      terminationGracePeriodSeconds: {{ $discovery.terminationGracePeriodSeconds }}
      volumes:
        - name: config
          configMap:
            name: discovery-service-config
            defaultMode: 420
