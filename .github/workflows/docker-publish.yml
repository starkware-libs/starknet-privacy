name: Docker-Publish

# Release-only. Builds the multi-arch discovery-service and proof-interceptor images
# and publishes them to ghcr.io when a `PRIVACY-*` tag is pushed. The image tag is the
# git tag verbatim (PRIVACY-0.14.3-RC.8 -> :PRIVACY-0.14.3-RC.8), which is what the
# per-env values files pin.
#
# The third image the chart deploys, transaction-prover, is built from
# starkware-libs/sequencer by starknet_transaction_prover_docker_publish.yml on the
# same `PRIVACY-*` tag convention.
#
# discovery-service-docker.yaml and proof-interceptor-docker.yaml still build on PRs
# and main, but no longer on tags — this workflow is the only writer of release tags.

on:
  workflow_dispatch:
  push:
    tags:
      - "PRIVACY-*"

permissions:
  contents: read
  packages: write

# A tag is an immutable release — never cancel a run that may already have pushed.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.image.name }} (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: discovery-service
            file: deploy/discovery-service/Dockerfile
          - name: proof-interceptor
            file: deploy/proof-interceptor/Dockerfile
        platform:
          - name: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - name: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        id: build
        with:
          context: .
          file: ${{ matrix.image.file }}
          platforms: ${{ matrix.platform.name }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}",push-by-digest=true,name-canonical=true,push=true

      - run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
        shell: bash

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge ${{ matrix.image }} manifest
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image:
          - discovery-service
          - proof-interceptor
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          # No `type=semver`: PRIVACY-* tags do not parse as semver, so it would emit nothing.
          tags: |
            # The git tag verbatim, e.g. PRIVACY-0.14.3-RC.8 -> :PRIVACY-0.14.3-RC.8
            type=raw,enable=${{ github.event_name == 'push' }},value={{tag}}
            # Manual dispatch — never writes a release tag.
            type=raw,value=test-{{sha}},enable=${{ github.event_name == 'workflow_dispatch' }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true

      - name: Create multi-arch manifest
        run: |
          cd /tmp/digests
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}')
          if [ -z "$tags" ]; then
            echo "No tags were generated by docker/metadata-action; refusing to publish an untagged manifest."
            exit 1
          fi
          sources=$(printf '${{ env.IMAGE_PREFIX }}/${{ matrix.image }}@sha256:%s ' *)
          docker buildx imagetools create $tags $sources
        shell: bash
