name: SDK Branch Tarball

# Packs the SDK from any branch as a `<x.y.z>-<branch>.<sha>` tarball and uploads it as a workflow
# artifact for testing. Branch builds never go to npmjs: a version published there is public and
# permanent, and since prerelease identifiers compare lexically, a branch name sorting after `rc`
# would satisfy dapps' `^x.y.z-rc.N` ranges. Releases go through npm-release.yml.

on:
  workflow_dispatch:

jobs:
  pack:
    name: Pack branch tarball
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
          # Keyed per install scope: `npm ci` in sdk/ installs only the SDK workspace, so sharing the
          # root lockfile's key with full installs would fill that cache with only its packages.
          cache-dependency-path: |
            package-lock.json
            sdk/package.json

      - name: Install npm dependencies
        run: npm ci

      - name: Compute branch version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          BRANCH=$(printf '%s' "$REF_NAME" | tr '/_' '-' | tr -cd 'a-zA-Z0-9-')
          SHORT_SHA=${SHA::7}
          BASE=$(node -p "require('./package.json').version")
          # Strip any existing prerelease suffix from BASE so reruns stay clean.
          BASE_CLEAN=${BASE%%-*}
          NEW_VERSION="${BASE_CLEAN}-${BRANCH}.${SHORT_SHA}"
          npm pkg set version="$NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      # Same build as npm-release.yml, so the tarball matches what a release ships.
      - name: Build
        run: npm run build && npm run build:browser

      - name: Pack tarball
        id: pack
        run: |
          TARBALL=$(npm pack --silent)
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Upload tarball as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.pack.outputs.tarball }}
          path: sdk/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        env:
          PACKED_VERSION: ${{ steps.version.outputs.version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Packed \`@starkware-libs/starknet-privacy-sdk@${PACKED_VERSION}\`"
            echo
            echo "Open the run page below and grab \`${TARBALL}\` from the *Artifacts* section at the bottom:"
            echo
            echo "${RUN_URL}"
            echo
            echo "GitHub wraps the artifact in a \`.zip\`. After unzipping:"
            echo '```'
            echo "npm install ./${TARBALL}"
            echo '```'
            echo
            # A prerelease satisfies a range only when the range names a prerelease of the same x.y.z,
            # so a branch build is outside the client's `^x.y.z` peer range.
            echo "Next to a published \`@starkware-libs/starknet-privacy-client\`, this version is outside the client's SDK peer range; add \`--legacy-peer-deps\` if npm reports \`ERESOLVE\`."
          } >> "$GITHUB_STEP_SUMMARY"
