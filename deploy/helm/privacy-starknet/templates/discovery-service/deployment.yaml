{{- $discovery := .Values.discoveryService -}}
{{- $component := list . "discovery-service" -}}
{{- $_ := required "discoveryService.config.rpcUrl is required" $discovery.config.rpcUrl -}}
{{- $_ := required "discoveryService.config.wsUrl is required" $discovery.config.wsUrl -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "privacy-starknet.componentName" $component }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "privacy-starknet.labels" $component | nindent 4 }}
spec:
  replicas: {{ $discovery.replicaCount }}
  selector:
    matchLabels:
      {{- include "privacy-starknet.selectorLabels" $component | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/discovery-service/configmap.yaml") . | sha256sum }}
        {{- if $discovery.ohttp.enabled }}
        checksum/ohttp: {{ include (print $.Template.BasePath "/discovery-service/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with $discovery.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "privacy-starknet.labels" $component | nindent 8 }}
        {{- with $discovery.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $discovery.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: discovery-service
          image: {{ include "privacy-starknet.image" (list . $discovery.image) | quote }}
          imagePullPolicy: {{ $discovery.image.pullPolicy }}
          {{- with $discovery.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - --config
            - /etc/discovery-service/config.toml
          # The other settings are in config.toml. API_HOST stays here because the image sets
          # API_HOST, and an env var overrides the file.
          env:
            - name: API_HOST
              value: {{ printf "0.0.0.0:%v" $discovery.port | quote }}
            {{- if $discovery.ohttp.enabled }}
            - name: OHTTP_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "privacy-starknet.ohttpSecretName" (list . "discovery-service" $discovery.ohttp) }}
                  key: key
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $discovery.port }}
              protocol: TCP
          {{- with $discovery.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $discovery.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $discovery.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/discovery-service/config.toml
              subPath: config.toml
              readOnly: true
      {{- with $discovery.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $discovery.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $discovery.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "privacy-starknet.componentName" $component }}
