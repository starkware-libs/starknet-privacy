{{- $discovery := .Values.discoveryService -}}
{{- $component := list . "discovery-service" -}}
{{- $annotations := deepCopy (default (dict) $discovery.service.annotations) -}}
{{- if $discovery.backendConfig.enabled -}}
{{- $_ := set $annotations "cloud.google.com/backend-config" (dict "default" (include "privacy-starknet.componentName" $component) | toJson) -}}
{{- end -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "privacy-starknet.componentName" $component }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "privacy-starknet.labels" $component | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $discovery.service.type }}
  ports:
    - name: http
      port: {{ $discovery.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "privacy-starknet.selectorLabels" $component | nindent 4 }}
