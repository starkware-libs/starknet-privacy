name: SDK Prerelease Tarball

# Builds an installable SDK tarball from the dispatched branch and attaches it to the run.
# It publishes nothing: npm releases are manual (see sdk/README.md), so no workflow holds
# registry credentials and unreviewed branch code never reaches a public registry.

on:
  workflow_dispatch:

jobs:
  pack:
    name: Pack branch prerelease tarball
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Compute prerelease version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          BRANCH=$(printf '%s' "$REF_NAME" | tr '/_' '-' | tr -cd 'a-zA-Z0-9-')
          SHORT_SHA=${SHA::7}
          BASE=$(node -p "require('./package.json').version")
          # Strip any existing prerelease suffix from BASE so reruns stay clean.
          BASE_CLEAN=${BASE%%-*}
          NEW_VERSION="${BASE_CLEAN}-${BRANCH}.${SHORT_SHA}"
          npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build

      - name: Pack tarball
        id: pack
        run: |
          TARBALL=$(npm pack --silent)
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Upload tarball as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.pack.outputs.tarball }}
          path: sdk/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        env:
          PACKED_VERSION: ${{ steps.version.outputs.version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Packed \`@starkware-libs/starknet-privacy-sdk@${PACKED_VERSION}\` (not published)"
            echo
            echo "**Download the tarball from this run** (browser, GitHub login only)."
            echo "Open the run page below and grab \`${TARBALL}\` from the *Artifacts* section at the bottom:"
            echo
            echo "${RUN_URL}"
            echo
            echo "GitHub wraps the artifact in a \`.zip\`. After unzipping:"
            echo '```'
            echo "npm install ./${TARBALL}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
