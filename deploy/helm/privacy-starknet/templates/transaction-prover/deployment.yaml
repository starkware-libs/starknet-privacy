{{- $prover := include "privacy-starknet.componentValues" (list . "transactionProver") | fromYaml -}}
{{- $sidecar := include "privacy-starknet.componentValues" (list . "transactionProver" "proofInterceptor") | fromYaml -}}
{{- $_ := required "transactionProver.config.rpc_node_url is required" $prover.config.rpc_node_url -}}
{{- $_ := required "transactionProver.config.chain_id is required" $prover.config.chain_id -}}
{{- if $prover.ohttp.enabled -}}
{{- $_ := required "transactionProver.ohttp.key (or global.ohttp.key) is required when OHTTP is enabled" $prover.ohttp.key -}}
{{- end -}}
{{- if $sidecar.enabled -}}
{{- $_ := required "transactionProver.proofInterceptor.image.tag (or global.image.tag) is required when proofInterceptor is enabled" $sidecar.image.tag -}}
{{- $_ := required "transactionProver.proofInterceptor.screening.url is required when proofInterceptor is enabled" $sidecar.screening.url -}}
{{- $_ := required "transactionProver.proofInterceptor.screening.poolAddress is required when proofInterceptor is enabled" $sidecar.screening.poolAddress -}}
{{- $_ := required "transactionProver.proofInterceptor.screening.anonymizerAddress is required when proofInterceptor is enabled" $sidecar.screening.anonymizerAddress -}}
{{- if hasKey $sidecar.screening "rpcUrl" -}}
{{- fail "transactionProver.proofInterceptor.screening.rpcUrl is chart-owned: the sidecar's SCREENING_RPC_URL is wired from transactionProver.config.rpc_node_url so both containers read the same node" -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-prover
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "privacy-starknet.labels" . | nindent 4 }}
    app: transaction-prover
spec:
  progressDeadlineSeconds: {{ $prover.progressDeadlineSeconds }}
  replicas: {{ $prover.replicas }}
  revisionHistoryLimit: {{ $prover.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: transaction-prover
  strategy:
    type: {{ $prover.strategy.type }}
    {{- if eq $prover.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ $prover.strategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ $prover.strategy.rollingUpdate.maxUnavailable }}
    {{- end }}
  template:
    metadata:
      labels:
        app: transaction-prover
    spec:
      containers:
        - name: transaction-prover
          image: "{{ $prover.image.repository }}:{{ $prover.image.tag }}"
          imagePullPolicy: {{ $prover.image.pullPolicy }}
          args:
            - --config-file=/etc/config/config.json
          {{- if $prover.ohttp.enabled }}
          env:
            - name: OHTTP_ENABLED
              value: "true"
            - name: OHTTP_KEY
              value: {{ $prover.ohttp.key | quote }}
          {{- end }}
          ports:
            - containerPort: {{ $prover.config.port }}
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: {{ $prover.config.port }}
            initialDelaySeconds: {{ $prover.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ $prover.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ $prover.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ $prover.livenessProbe.failureThreshold }}
            successThreshold: {{ $prover.livenessProbe.successThreshold }}
          readinessProbe:
            tcpSocket:
              port: {{ $prover.config.port }}
            initialDelaySeconds: {{ $prover.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ $prover.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ $prover.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ $prover.readinessProbe.failureThreshold }}
            successThreshold: {{ $prover.readinessProbe.successThreshold }}
          volumeMounts:
            - name: transaction-prover-config
              mountPath: /etc/config
          {{- with $prover.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if $sidecar.enabled }}
        {{- with $sidecar }}
        - name: proof-interceptor
          image: "{{ .image.repository }}:{{ .image.tag }}"
          imagePullPolicy: {{ .image.pullPolicy }}
          ports:
            - containerPort: {{ .port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .port | quote }}
            - name: SCREENING_URL
              value: {{ .screening.url | quote }}
            - name: SCREENING_POOL_ADDRESS
              value: {{ .screening.poolAddress | quote }}
            - name: SCREENING_ANONYMIZER_ADDRESS
              value: {{ .screening.anonymizerAddress | quote }}
            - name: SCREENING_FAIL_OPEN
              value: {{ .screening.failOpen | quote }}
            - name: SCREENING_TIMEOUT_MS
              value: {{ .screening.timeoutMs | quote }}
            - name: SCREENING_MAX_RETRIES
              value: {{ .screening.maxRetries | quote }}
            - name: SCREENING_RPC_URL
              value: {{ $prover.config.rpc_node_url | quote }}
            - name: SCREENING_PARTNER_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .screeningSecretName }}
                  key: partner-name
            - name: SCREENING_PARTNER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .screeningSecretName }}
                  key: partner-secret
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .port }}
            initialDelaySeconds: {{ .livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .livenessProbe.failureThreshold }}
            successThreshold: {{ .livenessProbe.successThreshold }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .port }}
            initialDelaySeconds: {{ .readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .readinessProbe.failureThreshold }}
            successThreshold: {{ .readinessProbe.successThreshold }}
          {{- with .resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- end }}
      dnsPolicy: {{ $prover.dnsPolicy }}
      {{- with $prover.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $prover.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: {{ $prover.restartPolicy }}
      terminationGracePeriodSeconds: {{ $prover.terminationGracePeriodSeconds }}
      volumes:
        - name: transaction-prover-config
          configMap:
            name: transaction-prover-config
            defaultMode: 420
