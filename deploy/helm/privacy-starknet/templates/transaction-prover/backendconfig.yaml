{{- $prover := .Values.transactionProver -}}
{{- if $prover.backendConfig.enabled }}
{{- $component := list . "transaction-prover" }}
{{- $healthCheck := $prover.backendConfig.healthCheck }}
{{- if not (or $healthCheck.port $prover.proofInterceptor.enabled) }}
{{- fail "transactionProver.backendConfig.healthCheck.port is required when proofInterceptor is disabled: the prover has no GET health route for GCE to check" }}
{{- end }}
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ include "privacy-starknet.componentName" $component }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "privacy-starknet.labels" $component | nindent 4 }}
spec:
  # The prover has no GET health route, so GCE checks the proof-interceptor instead.
  healthCheck:
    type: {{ $healthCheck.type }}
    requestPath: {{ $healthCheck.requestPath }}
    port: {{ $healthCheck.port | default $prover.proofInterceptor.port }}
{{- end }}
