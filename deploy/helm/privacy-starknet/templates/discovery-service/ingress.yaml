{{- $discovery := include "privacy-starknet.componentValues" (list . "discoveryService") | fromYaml -}}
{{- if and $discovery.ingress $discovery.ingress.enabled }}
{{- $svcPort := $discovery.containerPort -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: discovery-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "privacy-starknet.labels" . | nindent 4 }}
    app: discovery-service
  {{- with $discovery.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $discovery.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $discovery.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $discovery.ingress.defaultBackend }}
  defaultBackend:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $discovery.ingress.hosts }}
    - {{- if .host }}
      host: {{ .host | quote }}
      {{- end }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: discovery-service
                port:
                  number: {{ .servicePort | default $svcPort }}
          {{- end }}
    {{- end }}
{{- end }}
