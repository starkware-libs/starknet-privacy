name: Client CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: Client Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          # The client resolves @starkware-libs/starknet-privacy-sdk from the sdk/ workspace, so
          # an SDK change can break the client's type-check just as a client change can.
          filters: |
            client:
              - 'client/**'
              - 'sdk/**'
              - 'package.json'
              - 'package-lock.json'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.filter.outputs.client == 'true'
        with:
          node-version: '24'
          cache: 'npm'
          # Keyed per install scope: a narrower install sharing the root lockfile's hash would otherwise
          # fill this cache with only its packages.
          cache-dependency-path: |
            package-lock.json
            client/package.json
      # The SDK's package exports point at ./dist; build it before linting the client so
      # `tsc --noEmit` can resolve the SDK's types.
      - if: steps.filter.outputs.client == 'true'
        run: npm ci -w sdk -w client && npm run build -w sdk
      - if: steps.filter.outputs.client == 'true'
        run: npm run lint -w client

  check:
    name: Client Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
          # Keyed per install scope: a narrower install sharing the root lockfile's hash would otherwise
          # fill this cache with only its packages.
          cache-dependency-path: |
            package-lock.json
            client/package.json

      # Build the SDK first: the client links it as a workspace and imports its compiled
      # ./dist entry points.
      - name: Install workspace and build SDK
        run: npm ci -w sdk -w client && npm run build -w sdk

      # The workspace links the local SDK regardless of the client's peer range, so a stale
      # range never fails an install here; it only breaks dapps installing the published pair.
      # A prerelease satisfies a range only within the same x.y.z (0.14.4-rc.0 is outside
      # ^0.14.3-rc.8), so every new SDK patch rc needs the range bumped.
      - name: Check the client's SDK peer range covers the workspace SDK
        run: |
          SDK_VERSION=$(node -p "require('./sdk/package.json').version")
          PEER_RANGE=$(node -p "require('./client/package.json').peerDependencies['@starkware-libs/starknet-privacy-sdk']")
          npm exec -w client -- semver --range "$PEER_RANGE" "$SDK_VERSION" > /dev/null \
            || { echo "::error::SDK $SDK_VERSION is outside the client's peer range $PEER_RANGE; bump it in client/package.json"; exit 1; }

      - name: Build client
        run: npm run build -w client

      - name: Run client tests
        run: npm run test -w client
